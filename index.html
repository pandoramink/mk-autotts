<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MK AutoTTS - AI Voice Generator</title>
  <link rel="stylesheet" href="./style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-container">
        <div class="logo-icon"></div>
        <h1>MK AutoTTS</h1>
      </div>
      <p class="subtitle">Powered by Gemini 2.5 Flash Native Audio</p>
    </header>

    <main class="app-main">
      <section class="input-section">
        <label for="api-key">Gemini API Key</label>
        <div class="input-wrapper" style="margin-bottom: 16px;">
          <input type="password" id="api-key" placeholder="Enter your Gemini API Key..."
            style="width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border-color); background: rgba(15, 23, 42, 0.6); color: var(--text-main); font-family: inherit; font-size: 0.95rem; margin-bottom: 16px;">
        </div>

        <label for="text-input">Text to Speech</label>
        <div class="textarea-wrapper">
          <textarea id="text-input"
            placeholder="Enter your text here to convert into natural, expressive speech..."></textarea>
        </div>
      </section>

      <section class="controls-section">
        <div class="control-group">
          <label for="voice-model">Voice Model</label>
          <div class="select-wrapper">
            <select id="voice-model">
              <!-- Official Live API Voices -->
              <option value="Aoede">Aoede</option>
              <option value="Charon">Charon</option>
              <option value="Fenrir">Fenrir</option>
              <option value="Kore">Kore</option>
              <option value="Puck">Puck</option>
              <!-- Extended Gemini TTS Voices -->
              <option value="Leda">Leda</option>
              <option value="Orion">Orion</option>
              <option value="Dipper">Dipper</option>
              <option value="Lyra">Lyra</option>
              <option value="Calliope">Calliope</option>
              <option value="Zephyr">Zephyr</option>
              <option value="Achernar">Achernar</option>
              <option value="Algenib">Algenib</option>
              <option value="Callirrhoe">Callirrhoe</option>
              <option value="Pulcherrima">Pulcherrima</option>
            </select>
            <div class="select-arrow"></div>
          </div>
        </div>

        <div class="control-group">
          <label for="emotion">Voice Emotion</label>
          <div class="select-wrapper">
            <select id="emotion">
              <option value="Neutral">Neutral</option>
              <option value="Happy">Happy</option>
              <option value="Energetic">Energetic</option>
              <option value="Serious">Serious</option>
              <option value="Calm">Calm</option>
              <option value="Sad">Sad</option>
              <option value="Angry">Angry</option>
            </select>
            <div class="select-arrow"></div>
          </div>
        </div>
      </section>

      <details class="advanced-options">
        <summary>Advanced Pro Settings</summary>
        <div class="advanced-grid">
          <div class="control-group">
            <label for="pacing">Pacing</label>
            <div class="select-wrapper">
              <select id="pacing">
                <option value="Normal">Normal</option>
                <option value="Slow">Slow</option>
                <option value="Fast">Fast</option>
              </select>
              <div class="select-arrow"></div>
            </div>
          </div>

          <div class="control-group">
            <label for="persona">Persona</label>
            <div class="select-wrapper">
              <select id="persona">
                <option value="None">None (Default)</option>
                <option value="News Anchor">News Anchor</option>
                <option value="Storyteller">Storyteller</option>
                <option value="Customer Service">Customer Service</option>
              </select>
              <div class="select-arrow"></div>
            </div>
          </div>

          <div class="control-group">
            <label for="pitch">Pitch</label>
            <div class="select-wrapper">
              <select id="pitch">
                <option value="Normal">Normal</option>
                <option value="Deep">Deep Voice</option>
                <option value="High">High-Pitched</option>
              </select>
              <div class="select-arrow"></div>
            </div>
          </div>

          <div class="control-group">
            <label for="audio-quality">Audio Quality</label>
            <div class="select-wrapper">
              <select id="audio-quality">
                <option value="24000">24 kHz (High Quality)</option>
                <option value="16000">16 kHz (Standard)</option>
              </select>
              <div class="select-arrow"></div>
            </div>
          </div>

          <div class="control-group checkbox-group">
            <label class="toggle-switch">
              <input type="checkbox" id="auto-play" checked>
              <span class="slider"></span>
            </label>
            <span class="toggle-label">Auto-play Audio</span>
          </div>

          <div class="control-group checkbox-group">
            <label class="toggle-switch">
              <input type="checkbox" id="natural-pauses">
              <span class="slider"></span>
            </label>
            <span class="toggle-label">Add Natural Pauses</span>
          </div>
        </div>
      </details>

      <section class="actions-section">
        <button id="generate-btn" class="primary-btn">
          <span class="btn-text">Generate Audio</span>
          <span class="loader hidden"></span>
        </button>

        <button id="download-btn" class="secondary-btn" disabled>
          <span class="btn-text">Download Audio</span>
        </button>
      </section>

      <section class="status-section">
        <p id="status-text" class="status-text">Ready</p>
        <div class="audio-player-container hidden" id="audio-container">
          <audio id="audio-player" controls></audio>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/main.js"></script>
</body>

</html>
